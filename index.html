<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday Pilayaaa 🎉</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
body{margin:0;font-family:Poppins,sans-serif;background:linear-gradient(135deg,#ff9a9e,#fad0c4);display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
.card{background:#fff;max-width:760px;margin:20px;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
h1{text-align:center;color:#ff4d6d}
#msg{white-space:pre-wrap;line-height:1.8;color:#444}
button{display:block;margin:20px auto 0;padding:12px 28px;border:none;border-radius:30px;background:#ff4d6d;color:#fff;font-size:18px}
.f{position:fixed;top:-20px;font-size:22px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh)}}
</style>
</head>
<body>
<div class="card">
<h1>🎂 Happy Birthday Pilayaaa! 🎉</h1>
<div id="msg"></div>
<button onclick="confetti({particleCount:250,spread:180})">🎁 Rayakan Lagi!</button>
</div>
<script>
const text=`HBD, PILAYAYAAA! 🎉

semoga di umur yang baru ini kamu selalu sehat, bahagia, dan semua urusanmu dimudahkan. Semoga apa yang lagi kamu usahakan sekarang bisa berjalan lancar, dan semua rencana yang kamu punya pelan-pelan bisa tercapai.

semoga tahun ini membawa banyak hal baik, ketemu orang-orang yang baik juga, dan makin banyak kesempatan buat berkembang. Kalau nanti ada hal yang nggak sesuai harapan, semoga tetap semangat dan tetap jalanin semuanya dengan sabar.

terima kasih sudah jadi orang yang asyik. Semoga tetap jadi diri sendiri, tetap rendah hati, dan jangan lupa nikmatin setiap prosesnya.

sekali lagi, selamat bertambah usia ya, pill. semoga panjang umur, sehat selalu, dimudahkan rezekinya, dan semoga tahun ini jadi tahun yang lebih baik dari sebelumnya. selamat menikmati hari spesialmu. semoga semua doa baik menyertaimu. 🤍`;
let i=0;
(function type(){if(i<text.length){msg.textContent+=text[i++];setTimeout(type,20);}})();
setInterval(()=>confetti({particleCount:8,spread:70,origin:{x:Math.random(),y:0}}),2500);
const e=["🎈","✨","💖","🎉"];
setInterval(()=>{let d=document.createElement("div");d.className="f";d.textContent=e[Math.floor(Math.random()*e.length)];d.style.left=Math.random()*100+"vw";d.style.animationDuration=(4+Math.random()*4)+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),9000)},400);
</script>
</body></html>
